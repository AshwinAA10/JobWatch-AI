name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobwatch
          POSTGRES_PASSWORD: jobwatch_dev
          POSTGRES_DB: jobwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://jobwatch:jobwatch_dev@localhost:5432/jobwatch
        run: |
          cd backend
          alembic upgrade head
          alembic check

      - name: Run Backend Test Suite
        env:
          DATABASE_URL: postgresql+psycopg://jobwatch:jobwatch_dev@localhost:5432/jobwatch
          APP_ENV: testing
          RATE_LIMIT_ENABLED: "false"
        run: |
          pytest backend/tests -v

      - name: Validate Production Config Logic
        run: |
          python scripts/validate_production_config.py

  frontend-checks:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

  docker-checks:
    name: Docker Validation & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config

      - name: Build Backend Container
        run: docker build -t jobwatch-backend:test ./backend

      - name: Build Frontend Container
        run: docker build -t jobwatch-frontend:test ./frontend
