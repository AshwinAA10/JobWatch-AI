version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobwatch-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=JobWatch AI
      - APP_ENV=development
      - APP_VERSION=0.1.0
      - DEBUG=true
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - API_V1_STR=/api/v1
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

# Future phase infrastructure (PostgreSQL, Redis, Workers) will be introduced in Phase 1+.
