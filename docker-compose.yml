services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobwatch-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=JobWatch AI
      - APP_ENV=development
      - APP_VERSION=0.1.0
      - DEBUG=true
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - API_V1_STR=/api/v1
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      - DATABASE_URL=${DOCKER_DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - AI_EXTRACTION_ENABLED=${AI_EXTRACTION_ENABLED:-true}
      - AI_EMBEDDING_ENABLED=${AI_EMBEDDING_ENABLED:-true}
      - AI_HYBRID_MATCHING_ENABLED=${AI_HYBRID_MATCHING_ENABLED:-true}
      - AI_EXPLANATIONS_ENABLED=${AI_EXPLANATIONS_ENABLED:-true}
      - MONITORING_ENABLED=false
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobwatch-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_NAME=JobWatch AI
      - APP_ENV=development
      - APP_VERSION=0.1.0
      - DEBUG=false
      - DATABASE_URL=${DOCKER_DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

      - MONITORING_ENABLED=true
      - MONITORING_INTERVAL_SECONDS=900
      - NOTIFICATIONS_ENABLED=true
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      disable: true
    command: python -m app.worker
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000/api/v1
    container_name: jobwatch-frontend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      - backend
    restart: unless-stopped


